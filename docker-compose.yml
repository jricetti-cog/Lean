# LEAN platform: infrastructure (plan step s2.3). Services from later phases add themselves to this file.
#
#   cp .env.example .env               # optional: every setting has a local-development default
#   docker compose --profile infra up            # foreground; or `up -d --wait` to block until healthy
#   docker compose --profile infra ps -a         # long-running services healthy, the two one-shot jobs Exited (0)
#
# docker-compose.override.yml is merged automatically for local development (source mounts, debug ports);
# use `docker compose -f docker-compose.yml ...` to run without it.
# Published ports bind to 127.0.0.1 only. Services reach each other by service name on the `lean` network.

name: ${COMPOSE_PROJECT_NAME:-lean}

# Shared settings for LEAN service containers added by later phases (`environment: *lean-service-env`, or
# `<<: *lean-service-env` to extend). Each service adds its own `ConnectionStrings__<Database>`.
x-lean-service-env: &lean-service-env
  RabbitMQ__Uri: amqp://${RABBITMQ_USER:-lean}:${RABBITMQ_PASSWORD:-lean-dev-rabbitmq}@rabbitmq:5672/${RABBITMQ_VHOST:-lean}
  S3__ServiceUrl: http://minio:9000
  S3__ForcePathStyle: "true"
  S3__AccessKey: ${MINIO_SERVICE_ACCESS_KEY:-lean-services}
  S3__SecretKey: ${MINIO_SERVICE_SECRET_KEY:-lean-dev-minio-services}
  S3__AlgorithmsBucket: ${MINIO_BUCKET_ALGORITHMS:-lean-algorithms}
  S3__ResultsBucket: ${MINIO_BUCKET_RESULTS:-lean-results}
  S3__ReportsBucket: ${MINIO_BUCKET_REPORTS:-lean-reports}
  LEAN_DATA_FOLDER: /Lean/Data/

# Fast first probe on start (start_interval), then a slower steady-state probe.
x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 60s
  start_interval: 1s

services:
  # Message broker (ADR 0002). Exchanges, queues, DLQs and policies load from the v1 topology contract
  # at boot; the management UI is on RABBITMQ_MANAGEMENT_PORT.
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13.7-management}
    profiles: [infra]
    hostname: rabbitmq
    restart: unless-stopped
    # Adds the compose user to the topology definitions before starting the broker (see the script).
    entrypoint: ["/bin/sh", "/etc/lean/entrypoint.sh"]
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-lean}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-lean-dev-rabbitmq}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-lean}
      # The cookie is passed on the command line instead of the image's .erlang.cookie file, which some
      # Docker hosts cannot read at boot (eacces).
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie ${RABBITMQ_ERLANG_COOKIE:-lean-dev-erlang-cookie}
      RABBITMQ_CTL_ERL_ARGS: -setcookie ${RABBITMQ_ERLANG_COOKIE:-lean-dev-erlang-cookie}
    volumes:
      - ./docs/architecture/contracts/topology/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docs/architecture/contracts/topology/definitions.json:/etc/lean/topology/definitions.json:ro
      - ./deploy/compose/rabbitmq/entrypoint.sh:/etc/lean/entrypoint.sh:ro
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - 127.0.0.1:${RABBITMQ_PORT:-5672}:5672
      - 127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    healthcheck:
      <<: *healthcheck
      # Healthy = AMQP and management listeners accept connections, the v1 topology is loaded and the
      # compose user can log in.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity && rabbitmqctl -q list_queues -p \"$$RABBITMQ_VHOST\" name | grep -qx jobs.backtest && rabbitmqctl -q authenticate_user \"$$RABBITMQ_USER\" \"$$RABBITMQ_PASSWORD\" >/dev/null"]
    networks: [lean]

  # Metadata store (ADR 0003): one server, one database + one login role per owning service.
  # deploy/compose/postgres/ creates them on first start; each service applies its own schema migrations.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.12-alpine}
    profiles: [infra]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lean-dev-postgres}
      POSTGRES_DB: postgres
      LEAN_DB_JOBS_PASSWORD: ${POSTGRES_JOBS_PASSWORD:-lean-dev-jobs}
      LEAN_DB_RESULTS_PASSWORD: ${POSTGRES_RESULTS_PASSWORD:-lean-dev-results}
      LEAN_DB_GATEWAY_PASSWORD: ${POSTGRES_GATEWAY_PASSWORD:-lean-dev-gateway}
      LEAN_DB_MARKETDATA_PASSWORD: ${POSTGRES_MARKETDATA_PASSWORD:-lean-dev-marketdata}
    volumes:
      - ./deploy/compose/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      <<: *healthcheck
      # TCP probe: the init-time server only listens on the socket, so this stays unhealthy until the
      # service databases exist and the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d marketdata"]
    networks: [lean]

  # S3-compatible artifact store (ADR 0003). Community MinIO build: upstream stopped publishing images.
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    profiles: [infra]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lean-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lean-dev-minio-admin}
    volumes:
      - minio-data:/data
    ports:
      - 127.0.0.1:${MINIO_API_PORT:-9000}:9000
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
    networks: [lean]

  # One-shot: creates the buckets and the least-privilege service account. Idempotent, runs on every `up`.
  minio-bootstrap:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    profiles: [infra]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap/minio-bootstrap.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lean-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lean-dev-minio-admin}
      MINIO_SERVICE_ACCESS_KEY: ${MINIO_SERVICE_ACCESS_KEY:-lean-services}
      MINIO_SERVICE_SECRET_KEY: ${MINIO_SERVICE_SECRET_KEY:-lean-dev-minio-services}
      MINIO_BUCKETS: ${MINIO_BUCKET_ALGORITHMS:-lean-algorithms} ${MINIO_BUCKET_RESULTS:-lean-results} ${MINIO_BUCKET_REPORTS:-lean-reports}
    volumes:
      - ./deploy/compose/minio:/bootstrap:ro
    networks: [lean]

  # One-shot: seeds the shared market-data volume (ADR 0004) from the repo's Data/ folder once; later runs
  # see the marker and exit. market-data mounts lean-data read-write, every other service read-only.
  lean-data-seed:
    image: ${SEED_IMAGE:-alpine:3.22.8}
    profiles: [infra]
    restart: "no"
    entrypoint: ["/bin/sh", "/seed/seed-lean-data.sh"]
    environment:
      LEAN_DATA_UID: ${LEAN_DATA_UID:-1654}
      LEAN_DATA_GID: ${LEAN_DATA_GID:-1654}
    volumes:
      - ./deploy/compose/lean-data:/seed:ro
      - ./Data:/source:ro
      - lean-data:/Lean/Data
    network_mode: none

  # Readiness gate: healthy once every long-running infrastructure service is healthy and both one-shot jobs
  # completed, so `up --wait` works for the infra profile and later services can depend on this one service.
  infra-ready:
    image: ${SEED_IMAGE:-alpine:3.22.8}
    profiles: [infra]
    restart: unless-stopped
    init: true
    command: ["sleep", "infinity"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      lean-data-seed:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "true"]
    network_mode: none

  # Job orchestrator (plan step s4.1): jobs API, job state machine in the `jobs` database, outbox to lean.jobs,
  # lean.events consumer, heartbeat retries and queue-depth metrics (GET /internal/v1/queues, /metrics).
  job-orchestrator:
    image: ${LEAN_IMAGE_REGISTRY:-lean}/job-orchestrator:${LEAN_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Services/Dockerfile
      target: job-orchestrator
    profiles: [orchestrator]
    restart: unless-stopped
    environment:
      <<: *lean-service-env
      ConnectionStrings__Jobs: Host=postgres;Port=5432;Database=jobs;Username=jobs;Password=${POSTGRES_JOBS_PASSWORD:-lean-dev-jobs}
      RabbitMQ__ManagementUri: http://rabbitmq:15672/
      Orchestrator__MaxAttempts: ${ORCHESTRATOR_MAX_ATTEMPTS:-3}
      Orchestrator__HeartbeatTimeoutSeconds: ${ORCHESTRATOR_HEARTBEAT_TIMEOUT_SECONDS:-90}
    ports:
      - 127.0.0.1:${ORCHESTRATOR_PORT:-5081}:8080
    depends_on:
      infra-ready:
        condition: service_healthy
    networks: [lean]

  # Market data (ADR 0004, plan step s3.1): the only writer of lean-data (catalog, downloads, history, live fan-out).
  #   docker compose --profile infra --profile market-data up -d --wait market-data
  market-data:
    image: ${LEAN_IMAGE_REGISTRY:-lean}/market-data:${LEAN_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Services/Dockerfile
      target: market-data
    profiles: [market-data]
    restart: unless-stopped
    depends_on:
      infra-ready:
        condition: service_healthy
    environment:
      <<: *lean-service-env
      ConnectionStrings__Marketdata: Host=postgres;Database=marketdata;Username=marketdata;Password=${POSTGRES_MARKETDATA_PASSWORD:-lean-dev-marketdata}
      # Simulated live feed (LEAN FakeDataQueue; no data vendor is connected) published on lean.marketdata.live.
      MarketData__Live__Symbols: ${MARKET_DATA_LIVE_SYMBOLS:-Equity/usa/SPY,Forex/oanda/EURUSD}
      MarketData__Live__Resolution: ${MARKET_DATA_LIVE_RESOLUTION:-Second}
    volumes:
      - lean-data:/Lean/Data
    ports:
      - 127.0.0.1:${MARKET_DATA_PORT:-5082}:8080
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "lean-healthcheck", "8080", "/readyz"]
    networks: [lean]

  # Results service (plan step s3.2): consumes `results.packets`, owns the PostgreSQL `results` database, reads and
  # writes result JSON in MinIO `lean-results`, serves the results API (internal: the gateway fronts it).
  results:
    image: ${LEAN_IMAGE_REGISTRY:-lean}/results:${LEAN_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Services/Dockerfile
      target: results
    profiles: [results]
    restart: unless-stopped
    environment:
      <<: *lean-service-env
      ConnectionStrings__Results: Host=postgres;Port=5432;Database=results;Username=results;Password=${POSTGRES_RESULTS_PASSWORD:-lean-dev-results}
    volumes:
      - lean-data:/Lean/Data:ro
    ports:
      - 127.0.0.1:${RESULTS_PORT:-5083}:8080
    depends_on:
      infra-ready:
        condition: service_healthy
    networks: [lean]

  # Report (plan step s3.3): renders LEAN's Report from stored result JSON (lean-results) into lean-reports.
  # Engine image (pythonnet); data-folder is the absolute lean-data mount (market-hours database).
  report:
    image: ${LEAN_IMAGE_REGISTRY:-lean}/report:${LEAN_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Services/Dockerfile
      target: report
    profiles: [report]
    restart: unless-stopped
    environment:
      <<: *lean-service-env
      Report__DataFolder: /Lean/Data/
      Report__WorkDirectory: /work/reports
      Report__ResultsApiUrl: http://results:8080/
    volumes:
      - lean-data:/Lean/Data:ro
    ports:
      - 127.0.0.1:${REPORT_PORT:-5084}:8080
    depends_on:
      infra-ready:
        condition: service_healthy
    networks: [lean]

  # Research (plan step s3.4): JupyterLab + QuantBook (Services/Dockerfile `research`, from DockerfileJupyter) over the
  # lean-data volume, read-only (ADR 0004). Notebooks reach the services through the injected base URLs; the sample
  # ServicesQuantBookTemplate.ipynb pulls history from market-data and a finished backtest from results. Notebooks saved
  # under work/ persist in the research-notebooks volume.
  #   docker compose --profile infra --profile market-data --profile results --profile research up -d --wait
  #   open http://127.0.0.1:${RESEARCH_PORT:-8888}/lab
  research:
    image: ${LEAN_IMAGE_REGISTRY:-lean}/research:${LEAN_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Services/Dockerfile
      target: research
    profiles: [research]
    restart: unless-stopped
    depends_on:
      infra-ready:
        condition: service_healthy
    environment:
      LEAN_DATA_FOLDER: /Lean/Data/
      LEAN_MARKET_DATA_URL: ${LEAN_MARKET_DATA_URL:-http://market-data:8080}
      LEAN_RESULTS_URL: ${LEAN_RESULTS_URL:-http://results:8080}
      LEAN_ORCHESTRATOR_URL: ${LEAN_ORCHESTRATOR_URL:-http://job-orchestrator:8080}
      LEAN_REPORT_URL: ${LEAN_REPORT_URL:-http://report:8080}
    volumes:
      - lean-data:/Lean/Data:ro
      - research-notebooks:/home/app/Notebooks/work
    ports:
      - 127.0.0.1:${RESEARCH_PORT:-8888}:8888
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "lean-healthcheck", "8888", "/api"]
    networks: [lean]

  # ToolBox (plan step s3.4): converters and generators as one-shot jobs on the market-data volume. lean-toolbox runs
  # the app against a staging copy and renames finished files into place, like market-data's fetch tasks (ADR 0004);
  # generators only add files (a run that would overwrite existing data publishes nothing). Converter inputs are
  # read from TOOLBOX_INPUT_DIR, mounted read-only at /input.
  #   docker compose --profile toolbox run --rm toolbox help
  #   docker compose --profile toolbox run --rm toolbox rdg --tickers=SYNA --start=20240101 --end=20240131 ...
  toolbox:
    image: ${LEAN_IMAGE_REGISTRY:-lean}/toolbox:${LEAN_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Services/Dockerfile
      target: toolbox
    profiles: [toolbox]
    restart: "no"
    environment:
      LEAN_DATA_FOLDER: /Lean/Data/
      TOOLBOX_SEED: ${TOOLBOX_SEED:-all}
      TOOLBOX_DRY_RUN: ${TOOLBOX_DRY_RUN:-0}
    volumes:
      - lean-data:/Lean/Data
      - ${TOOLBOX_INPUT_DIR:-./deploy/compose/toolbox-input}:/input:ro
    network_mode: none

volumes:
  rabbitmq-data:
  postgres-data:
  minio-data:
  lean-data:
  research-notebooks:

networks:
  lean:
