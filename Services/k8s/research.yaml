# JupyterLab / QuantBook research image. JupyterLab runs without a token, so it is only exposed inside
# the cluster; reach it with: kubectl -n lean port-forward svc/lean-research 8888:8888
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lean-research
  namespace: lean
  labels: { app.kubernetes.io/name: lean-research, app.kubernetes.io/part-of: lean }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: lean-research }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lean-research, app.kubernetes.io/part-of: lean }
    spec:
      containers:
        - name: research
          image: lean-services/research:latest
          ports: [{ name: http, containerPort: 8888 }]
          volumeMounts: [{ name: data, mountPath: /home/Data }]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 4Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: lean-data }
---
apiVersion: v1
kind: Service
metadata:
  name: lean-research
  namespace: lean
spec:
  selector: { app.kubernetes.io/name: lean-research }
  ports: [{ name: http, port: 8888, targetPort: http }]
