# Broker settings the v1 contracts rely on (topology.md). Loaded with definitions.json.
# Hard cap on any message body: 1 MiB. The contract limit for inline bodies is 256 KiB;
# this broker cap only catches publishers that ignore it.
max_message_size = 1048576
# Above the orchestrator's maximum backtest runtime (6 h): backtest/report/optimization/fetch
# deliveries stay unacked until the job is terminal (ADR 0002 ack rules). 7 h in ms.
consumer_timeout = 25200000
load_definitions = /etc/rabbitmq/definitions.json
default_vhost = lean
