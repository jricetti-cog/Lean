# LEAN platform services CI (plan step s2.4).
#   images: build every Services/Dockerfile image (docker-bake.hcl), gate their size, run the compose smoke test
#           (infra up, BasicTemplateAlgorithm submitted and completed), lint the Helm chart, then push versioned
#           images to GHCR on master and on v* tags (deploy/README.md).
#   tests:  Tests/Services, then the existing unit suite, inside quantconnect/lean:foundation.
# Every step is a plain command, so the same commands verify a change locally (see deploy/compose/README.md).
name: Services

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LEAN_FOUNDATION: quantconnect/lean:foundation
  TAG: ${{ github.sha }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # quantconnect/lean:foundation is ~14 GB compressed: make room for it, the engine images and the build stage.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - name: Image registry
        run: echo "REGISTRY=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/lean" >> "$GITHUB_ENV"

      # The default `docker` buildx driver loads every image into the engine with shared layers (no tarball export).
      - name: Build every service image
        run: |
          docker pull "$LEAN_FOUNDATION"
          docker pull mcr.microsoft.com/dotnet/aspnet:10.0
          docker buildx bake -f Services/docker-bake.hcl
          docker image ls "$REGISTRY/*"

      - name: Image size gate
        run: bash Services/check-image-sizes.sh

      - name: Compose up (infra profile)
        run: docker compose up -d --wait infra-ready

      - name: Infra smoke test
        run: sh deploy/compose/verify-infra.sh

      - name: Compose smoke test (submit BasicTemplateAlgorithm, assert it completes)
        run: sh deploy/compose/smoke-backtest.sh

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Compose down
        if: always()
        run: docker compose down -v

      - name: Helm chart lint
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          helm lint deploy/helm/lean-platform
          helm template lean deploy/helm/lean-platform --namespace lean > /dev/null

      # Versioned images: every master build is <sha> and `master`; a v<version> tag also publishes <version> and
      # `latest`, plus the chart as oci://ghcr.io/<owner>/lean/charts/lean-platform:<version>.
      - name: Push images to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          extra=master
          case "$GITHUB_REF" in refs/tags/v*) extra="${GITHUB_REF#refs/tags/v} latest" ;; esac
          for svc in api-gateway job-orchestrator results optimizer backtest-worker live-worker market-data report research toolbox console lean-data; do
            docker push "$REGISTRY/$svc:$TAG"
            for t in $extra; do docker tag "$REGISTRY/$svc:$TAG" "$REGISTRY/$svc:$t" && docker push "$REGISTRY/$svc:$t"; done
          done

      - name: Push Helm chart to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/lean-platform --version "${GITHUB_REF#refs/tags/v}" --app-version "${GITHUB_REF#refs/tags/v}"
          helm push "lean-platform-${GITHUB_REF#refs/tags/v}.tgz" "oci://$REGISTRY/charts"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          docker pull "$LEAN_FOUNDATION"

      # The repo is mounted at its own path: pythonnet and coverlet need the build path inside the container.
      - name: Build
        run: docker run --rm -v "$PWD:$PWD" -w "$PWD" "$LEAN_FOUNDATION" dotnet build QuantConnect.Lean.sln -c Release /v:quiet /p:WarningLevel=1

      - name: Tests/Services
        run: >-
          docker run --rm -v "$PWD:$PWD" -w "$PWD/Tests/bin/Release" "$LEAN_FOUNDATION"
          dotnet test QuantConnect.Tests.dll --filter "FullyQualifiedName~QuantConnect.Tests.Services"

      - name: Unit suite
        run: >-
          docker run --rm -v "$PWD:$PWD" -w "$PWD/Tests/bin/Release" "$LEAN_FOUNDATION"
          dotnet test QuantConnect.Tests.dll --blame-hang-timeout 300seconds --blame-crash
          --filter "TestCategory!=TravisExclude&TestCategory!=ResearchRegressionTests"
          -- TestRunParameters.Parameter\(name=\"log-handler\",\ value=\"ConsoleErrorLogHandler\"\)
