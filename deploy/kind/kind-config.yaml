# kind cluster for the lean-platform chart: one node (lean-data is a ReadWriteOnce local-path PVC shared by the pods on it).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
