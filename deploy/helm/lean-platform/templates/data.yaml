apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lean-data
  labels: {{- include "lean.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: {{- toYaml .Values.data.accessModes | nindent 4 }}
  {{- with .Values.data.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.data.storage }} } }
{{- if .Values.data.seed.enabled }}
---
# Fills an empty lean-data PVC from the lean-data image (deploy/compose/lean-data/seed-lean-data.sh; no-op once seeded).
apiVersion: batch/v1
kind: Job
metadata:
  name: lean-data-seed-{{ .Release.Revision }}
  labels: {{- include "lean.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: lean-data-seed, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: lean-platform }
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: seed
          image: {{ include "lean.image" (dict "root" $ "name" .Values.data.seed.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: LEAN_DATA_UID, value: {{ .Values.data.uid | quote }} }
            - { name: LEAN_DATA_GID, value: {{ .Values.data.uid | quote }} }
          volumeMounts: [{ name: lean-data, mountPath: /Lean/Data }]
      volumes:
        - name: lean-data
          persistentVolumeClaim: { claimName: lean-data }
{{- end }}
