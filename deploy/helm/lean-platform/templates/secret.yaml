{{- if not .Values.existingSecret }}
{{- $c := .Values.global.credentials }}
{{- $e := .Values.endpoints }}
{{- $pg := printf "Host=%s;Port=%v" $e.postgres.host $e.postgres.port }}
# Service environment shared by every platform container (the Compose x-lean-service-env anchor plus per-service secrets).
apiVersion: v1
kind: Secret
metadata:
  name: lean-platform-env
  labels: {{- include "lean.labels" . | nindent 4 }}
type: Opaque
stringData:
  RabbitMQ__Uri: {{ printf "amqp://%s:%s@%s:%v/%s" $c.rabbitmq.user $c.rabbitmq.password $e.rabbitmq.host $e.rabbitmq.port $c.rabbitmq.vhost | quote }}
  RabbitMQ__ManagementUri: {{ $e.rabbitmq.managementUrl | quote }}
  {{- $mgmt := urlParse $e.rabbitmq.managementUrl }}
  {{- $mgmtHost := $mgmt.host }}
  {{- if not (contains "." (regexReplaceAll ":[0-9]+$" $mgmtHost "")) }}
  {{- $mgmtHost = printf "%s.%s.svc%s" (regexReplaceAll ":[0-9]+$" $mgmtHost "") .Release.Namespace (regexFind ":[0-9]+$" $mgmtHost) }}
  {{- end }}
  # KEDA RabbitMQ scaler: management API (ready + unacked messages), namespace-qualified because KEDA resolves it.
  RabbitMQ__ScalerHost: {{ printf "%s://%s:%s@%s/%s" $mgmt.scheme $c.rabbitmq.user $c.rabbitmq.password $mgmtHost $c.rabbitmq.vhost | quote }}
  S3__AccessKey: {{ $c.minio.accessKey | quote }}
  S3__SecretKey: {{ $c.minio.secretKey | quote }}
  ConnectionStrings__Jobs: {{ printf "%s;Database=jobs;Username=jobs;Password=%s" $pg $c.postgres.jobsPassword | quote }}
  ConnectionStrings__Results: {{ printf "%s;Database=results;Username=results;Password=%s" $pg $c.postgres.resultsPassword | quote }}
  ConnectionStrings__Marketdata: {{ printf "%s;Database=marketdata;Username=marketdata;Password=%s" $pg $c.postgres.marketdataPassword | quote }}
  Gateway__ApiKeys__0__Key: {{ $c.gatewayApiKey | quote }}
  LEAN_API_KEY: {{ $c.gatewayApiKey | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lean-platform-env
  labels: {{- include "lean.labels" . | nindent 4 }}
data:
  {{- $b := .Values.global.credentials.minio.buckets }}
  S3__ServiceUrl: {{ .Values.endpoints.s3.serviceUrl | quote }}
  S3__ForcePathStyle: {{ .Values.endpoints.s3.forcePathStyle | toString | quote }}
  S3__AlgorithmsBucket: {{ $b.algorithms | quote }}
  S3__ResultsBucket: {{ $b.results | quote }}
  S3__ReportsBucket: {{ $b.reports | quote }}
  LEAN_DATA_FOLDER: /Lean/Data/
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.endpoints.otlp | quote }}
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
