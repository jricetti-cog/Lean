# PostgreSQL (ADR 0003): one database and role per owning service, created by the Compose initdb script.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: lean-platform }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          envFrom: [{ secretRef: { name: lean-infra } }]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d marketdata'] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER"'] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: files, mountPath: /docker-entrypoint-initdb.d/10-service-databases.sh, subPath: 10-service-databases.sh }
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: files
          configMap: { name: lean-infra-files }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
{{- include "infra.storageClass" . }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
