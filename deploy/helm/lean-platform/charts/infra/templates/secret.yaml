{{- $c := .Values.global.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: lean-infra
  labels: {{- include "infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  RABBITMQ_USER: {{ $c.rabbitmq.user | quote }}
  RABBITMQ_PASSWORD: {{ $c.rabbitmq.password | quote }}
  RABBITMQ_VHOST: {{ $c.rabbitmq.vhost | quote }}
  RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-setcookie {{ .Values.rabbitmq.erlangCookie }}"
  RABBITMQ_CTL_ERL_ARGS: "-setcookie {{ .Values.rabbitmq.erlangCookie }}"
  POSTGRES_USER: {{ $c.postgres.adminUser | quote }}
  POSTGRES_PASSWORD: {{ $c.postgres.adminPassword | quote }}
  POSTGRES_DB: postgres
  LEAN_DB_JOBS_PASSWORD: {{ $c.postgres.jobsPassword | quote }}
  LEAN_DB_RESULTS_PASSWORD: {{ $c.postgres.resultsPassword | quote }}
  LEAN_DB_GATEWAY_PASSWORD: {{ $c.postgres.gatewayPassword | quote }}
  LEAN_DB_MARKETDATA_PASSWORD: {{ $c.postgres.marketdataPassword | quote }}
  MINIO_ROOT_USER: {{ $c.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ $c.minio.rootPassword | quote }}
  MINIO_SERVICE_ACCESS_KEY: {{ $c.minio.accessKey | quote }}
  MINIO_SERVICE_SECRET_KEY: {{ $c.minio.secretKey | quote }}
  MINIO_BUCKETS: {{ printf "%s %s %s" $c.minio.buckets.algorithms $c.minio.buckets.results $c.minio.buckets.reports | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lean-infra-files
  labels: {{- include "infra.labels" . | nindent 4 }}
data:
{{- range $name, $_ := .Files.Glob "files/*" }}
  {{ base $name }}: |-
{{ $.Files.Get $name | indent 4 }}
{{- end }}
