# Message broker (ADR 0002): the v1 topology contract loads at boot, as in docker-compose.yml.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: amqp, port: 5672 }
    - { name: management, port: 15672 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels: {{- include "infra.labels" . | nindent 4 }}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: lean-platform }
      annotations:
        checksum/files: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          command: ["/bin/sh", "/etc/lean/entrypoint.sh"]
          envFrom: [{ secretRef: { name: lean-infra } }]
          env:
            # stable node name so the data volume survives pod restarts
            - { name: RABBITMQ_NODENAME, value: rabbit@localhost }
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          readinessProbe:
            exec:
              command: ["sh", "-c", 'rabbitmq-diagnostics -q check_port_connectivity && rabbitmqctl -q list_queues -p "$RABBITMQ_VHOST" name | grep -qx jobs.backtest']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources: {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - { name: files, mountPath: /etc/rabbitmq/rabbitmq.conf, subPath: rabbitmq.conf }
            - { name: files, mountPath: /etc/lean/topology/definitions.json, subPath: definitions.json }
            - { name: files, mountPath: /etc/lean/entrypoint.sh, subPath: rabbitmq-entrypoint.sh }
            - { name: data, mountPath: /var/lib/rabbitmq }
      volumes:
        - name: files
          configMap: { name: lean-infra-files }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
{{- include "infra.storageClass" . }}
        resources: { requests: { storage: {{ .Values.rabbitmq.storage }} } }
